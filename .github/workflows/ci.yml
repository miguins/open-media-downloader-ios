name: CI

on:
  # Branches only: a release tag points at a commit that CI already verified on main.
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.development.yaml config --quiet

      - name: Run all checks
        run: make ci

      - name: Clean up containers
        if: always()
        run: docker compose -f compose.development.yaml down --volumes --remove-orphans
