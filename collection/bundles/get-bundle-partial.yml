info:
  name: get-bundle-partial
  type: http
  seq: 5
  tags:
    - smoke

http:
  method: GET
  headers:
    - name: Range
      value: bytes=0-3
  url: "{{baseUrl}}/v1/bundles/{{bundleToken}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.headers['x-trace-id']
      operator: matches
      value: ^[a-z2-7]{26}$
    - expression: res.status
      operator: eq
      value: "206"
    - expression: res.headers['content-type']
      operator: eq
      value: application/zip
    - expression: res.headers['content-disposition']
      operator: contains
      value: attachment
    - expression: res.headers['x-content-type-options']
      operator: eq
      value: nosniff
    - expression: res.headers['cache-control']
      operator: eq
      value: no-store

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  Verifies a partial ZIP download using a satisfiable byte range.
