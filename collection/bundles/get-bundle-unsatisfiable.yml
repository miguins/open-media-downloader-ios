info:
  name: get-bundle-unsatisfiable
  type: http
  seq: 6
  tags:
    - smoke

http:
  method: GET
  headers:
    - name: Range
      value: bytes={{bundleSize}}-
  url: "{{baseUrl}}/v1/bundles/{{bundleToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("range reports the complete bundle size", function () {
          expect(res.getHeader("content-range")).to.equal("bytes */" + bru.getVar("bundleSize"));
        });
  assertions:
    - expression: res.headers['x-trace-id']
      operator: matches
      value: ^[a-z2-7]{26}$
    - expression: res.status
      operator: eq
      value: "416"
    - expression: res.headers['content-type']
      operator: eq
      value: text/plain; charset=utf-8
    - expression: res.headers['x-content-type-options']
      operator: eq
      value: nosniff
    - expression: res.headers['cache-control']
      operator: eq
      value: no-store

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  Verifies that an unsatisfiable bundle range returns a range error and the complete ZIP size.
