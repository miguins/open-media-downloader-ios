info:
  name: cancel-job
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/v1/jobs/{{jobId}}"
  auth:
    type: bearer
    token: "{{apiKey}}"

runtime:
  assertions:
    - expression: res.headers['x-trace-id']
      operator: matches
      value: ^[a-z2-7]{26}$
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.error
      operator: eq
      value: conflict

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  # cancel-job

  Cancels a queued or running job. The collection's job has already succeeded, so this request verifies the `409 conflict` response; cancellation of active jobs is covered by the Go tests because the fake extractor finishes almost immediately.
