info:
  name: jobs
  type: http
  seq: 1
  tags:
    - smoke

http:
  method: POST
  url: "{{baseUrl}}/v1/jobs"
  body:
    type: json
    data: |-
      {
        "url": "https://www.instagram.com/instagram/reel/DdwMu5VhCUn/?igsh=example"
      }
  auth:
    type: bearer
    token: "{{apiKey}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("jobId", res.body.id);
    - type: tests
      code: |-
        test("queues the normalized job", function () {
          const body = res.getBody();
          expect(body.status).to.equal("queued");
          expect(body.url).to.equal("https://www.instagram.com/reel/DdwMu5VhCUn/");
          expect(body.platform).to.equal("instagram");
          expect(body.error).to.equal(null);
          expect(res.getHeader("location")).to.equal("/v1/jobs/" + body.id);
        });
  assertions:
    - expression: res.headers['x-trace-id']
      operator: matches
      value: ^[a-z2-7]{26}$
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  # jobs

  Queues a download job for one public post on an allowed platform. Requires `Authorization: Bearer <API key>`. The example uses the account-handle link form that Instagram shares; the job stores it normalized, without the handle and tracking parameters.
