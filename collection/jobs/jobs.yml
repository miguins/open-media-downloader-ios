info:
  name: jobs
  type: http
  seq: 1
  tags:
    - smoke

http:
  method: POST
  url: "{{baseUrl}}/v1/jobs"
  body:
    type: json
    data: |-
      {
        "url": "https://vimeo.com/76979871"
      }
  auth:
    type: bearer
    token: "{{apiKey}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("jobId", res.body.id);
    - type: tests
      code: |-
        test("queues the normalized job", function () {
          const body = res.getBody();
          expect(body.status).to.equal("queued");
          expect(body.error).to.equal(null);
          expect(res.getHeader("location")).to.equal("/v1/jobs/" + body.id);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
  maxRedirects: 0
  forwardAuthorizationHeader: false

docs: |-
  # jobs

  Queues a download job for one public post on an allowed platform. Requires `Authorization: Bearer <API key>`.
