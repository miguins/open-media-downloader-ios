# Production deployment. Copy .env.example to .env, set OMDI_PUBLIC_URL to the
# address clients reach, and run: docker compose up --build --detach --wait
# Development uses compose.development.yaml through the Makefile targets.
name: omdi

services:
  app:
    build:
      context: .
      target: runtime
    image: omdi:local
    env_file:
      - path: .env
        required: false
    ports:
      # Loopback by default, for a tunnel or TLS reverse proxy on the same host.
      - "${OMDI_PUBLISH_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - omdi-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  omdi-data:
