services:
  app:
    environment:
      OMDI_RESTORE_API_KEY_ON_STARTUP: "false"
    command:
      - sh
      - -ec
      - >-
        mkdir -p "$$GOTMPDIR";
        go build -tags=omdi_testextractor -trimpath -o /home/omdi/.cache/go-build/omdi-dev ./cmd/omdi;
        exec /home/omdi/.cache/go-build/omdi-dev serve
