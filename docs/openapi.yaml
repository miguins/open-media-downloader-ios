openapi: 3.2.1
info:
  title: OpenMediaDownloaderIOS API
  version: 0.5.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check service liveness
      security: []
      responses:
        "200":
          description: The service process is alive.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
                additionalProperties: false
              example:
                status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Check service readiness
      description: >-
        Runs dependency checks for the database, the data directory and its free space,
        and the configured media tools. The response never identifies the failing check
        or discloses paths, versions, or error details.
      security: []
      responses:
        "200":
          description: Every dependency check passed.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "503":
          description: At least one dependency check failed.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: not_ready
  /v1/jobs:
    post:
      operationId: createJob
      summary: Queue a download job
      description: >-
        Normalizes one public post URL and checks it against the allowed platforms before
        queuing. Profiles, channels, playlists, feeds, and collections are rejected. Each API
        key may have a limited number of queued or running jobs.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: >-
                    One public post on an allowed platform; profiles, channels, playlists, feeds, and
                    collections are rejected. Tracking parameters are removed, and an Instagram post
                    link that starts with the account handle is stored without the handle.
              additionalProperties: false
            example:
              url: https://vimeo.com/123
      responses:
        "202":
          description: The job was queued.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              description: Path of the created job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnsupportedURL"
        "429":
          $ref: "#/components/responses/TooManyJobs"
        "500":
          $ref: "#/components/responses/Internal"
  /v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z2-7]{26}$"
    get:
      operationId: getJob
      summary: Get a job
      description: >-
        Returns the job. A succeeded carousel job has several ordered items. Every call issues
        fresh download links and invalidates links returned earlier for the same items and bundle.
        Newly succeeded multi-item jobs include a ZIP bundle, which may contain photos and videos.
        Single-item and legacy jobs without a persisted bundle omit it.
      security:
        - apiKey: []
      responses:
        "200":
          description: The job.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: cancelJob
      summary: Cancel a job
      description: >-
        Cancels a queued or running job. Canceling a canceled job succeeds without change;
        succeeded and failed jobs cannot be canceled.
      security:
        - apiKey: []
      responses:
        "200":
          description: The canceled job.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /v1/downloads/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque, short-lived download token from a job's item.
        schema:
          type: string
    get:
      operationId: downloadItem
      summary: Download a media item
      description: >-
        Streams the item granted by the token. The token is the only credential. Range
        requests are supported. Malformed, unknown, and expired tokens return the same 404.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Media"
        "206":
          $ref: "#/components/responses/Media"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "404":
          $ref: "#/components/responses/NotFound"
    head:
      operationId: headItem
      summary: Inspect a media item
      security: []
      responses:
        "200":
          description: Headers of the media item without a body.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          description: The token is malformed, unknown, or expired.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
  /v1/bundles/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque, short-lived token from the job's bundle; the only download credential.
        schema:
          type: string
    get:
      operationId: downloadBundle
      summary: Download a job's media bundle as ZIP
      description: >-
        Streams a persisted ZIP containing the ordered media items. Tokens may be reused
        until replacement or expiry. Range requests are supported. Malformed, unknown,
        replaced, expired, wrong-resource tokens and unavailable files share the same 404.
        Existing tokens survive API-key revocation until expiry or job/key purge.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/BundleFile"
        "206":
          $ref: "#/components/responses/BundleFile"
        "304":
          $ref: "#/components/responses/NotModified"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "404":
          $ref: "#/components/responses/NotFound"
    head:
      operationId: headBundle
      summary: Inspect a media bundle without downloading it
      description: >-
        Validates the same token as GET. Returns the full file's headers without a body.
        Range is ignored; conditional headers retain GET semantics. Every error has no body.
      security: []
      responses:
        "200":
          description: Full ZIP headers without a body.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Content-Type:
              schema:
                type: string
                const: application/zip
            Content-Length:
              schema:
                type: integer
                minimum: 1
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename=omdi-abcdefgh.zip
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Last-Modified:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        "304":
          $ref: "#/components/responses/NotModified"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "404":
          description: The token or bundle is unavailable; no body is returned.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
components:
  headers:
    NoStore:
      description: Responses must not be stored by clients or caches.
      schema:
        type: string
        const: no-store
    TraceId:
      description: >-
        Identifier of this request in the server logs. Include it when reporting a problem;
        it reveals nothing about the request.
      schema:
        type: string
        pattern: "^[a-z2-7]{26}$"
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "API key created with `omdi keys create`, sent as `Authorization: Bearer omdi_<id>_<secret>`."
  responses:
    InvalidRequest:
      description: The body is not a single JSON object with a string `url` and no other fields.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_request
    Unauthorized:
      description: The API key is missing, malformed, unknown, or revoked.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
    NotFound:
      description: The resource does not exist or belongs to another API key.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    Conflict:
      description: The job already succeeded or failed.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: conflict
    RequestTooLarge:
      description: The body exceeds the configured request size limit.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: request_too_large
    UnsupportedMediaType:
      description: The request content type is not `application/json`.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unsupported_media_type
    UnsupportedURL:
      description: The URL is not a public HTTPS URL on an allowed platform.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unsupported_url
    TooManyJobs:
      description: The API key already has the maximum number of queued or running jobs.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: too_many_jobs
    Internal:
      description: An internal error occurred. No details are disclosed.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal
    BundleFile:
      description: Full ZIP or requested ranges, served as an attachment. Multiple ranges use multipart/byteranges.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Disposition:
          schema:
            type: string
          example: attachment; filename=omdi-abcdefgh.zip
        Content-Length:
          schema:
            type: integer
            minimum: 1
        Content-Range:
          description: Included for a single partial range.
          schema:
            type: string
          example: bytes 0-3/123456
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Last-Modified:
          schema:
            type: string
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
        Referrer-Policy:
          schema:
            type: string
            const: no-referrer
      content:
        application/zip:
          schema:
            type: string
            format: binary
        multipart/byteranges:
          schema:
            type: string
            format: binary
    RangeNotSatisfiable:
      description: The requested byte range cannot be served. Returns the standard JSON error with code range_not_satisfiable.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Range:
          schema:
            type: string
          example: bytes */123456
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
        Referrer-Policy:
          schema:
            type: string
            const: no-referrer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: range_not_satisfiable
    NotModified:
      description: The file has not changed according to the conditional request. No body.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    PreconditionFailed:
      description: A conditional request's precondition failed. No body.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    Media:
      description: >-
        The media file, served as an attachment with `X-Content-Type-Options: nosniff`,
        `Cache-Control: no-store`, and `Referrer-Policy: no-referrer`.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Disposition:
          schema:
            type: string
          example: attachment; filename=omdi-abcdefgh-1.mp4
      content:
        video/*:
          schema:
            type: string
            format: binary
        image/*:
          schema:
            type: string
            format: binary
        audio/*:
          schema:
            type: string
            format: binary
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - not_found
            - conflict
            - request_too_large
            - range_not_satisfiable
            - unsupported_media_type
            - unsupported_url
            - too_many_jobs
            - internal
      additionalProperties: false
    Job:
      type: object
      required:
        - id
        - status
        - url
        - platform
        - error
        - error_detail
        - created_at
        - updated_at
        - expires_at
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
        url:
          type: string
          description: The normalized source URL.
        platform:
          type: string
          enum:
            - youtube
            - instagram
            - tiktok
            - x
            - reddit
            - vimeo
        error:
          type:
            - string
            - "null"
          enum:
            - unsupported_url
            - extraction_failed
            - too_large
            - timeout
            - internal
            - null
        error_detail:
          type:
            - string
            - "null"
          description: >-
            Why an `extraction_failed` job failed, derived from fixed patterns in the media tools'
            output; null for other errors. `blocked` is an anti-bot check, while
            `forbidden` is a refused request that may succeed later. `tool_error` means no known
            pattern matched, and `invalid_output` means the downloaded files did not pass
            validation. Jobs that fail with `forbidden`, `rate_limited`, or `network_error` have
            already been attempted twice.
          enum:
            - out_of_memory
            - login_required
            - blocked
            - forbidden
            - rate_limited
            - unavailable
            - geo_restricted
            - age_restricted
            - no_media
            - network_error
            - egress_denied
            - invalid_output
            - processing_failed
            - tool_error
            - null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the job and its files are removed.
        bundle:
          description: Present for newly succeeded multi-item jobs; absent for single-item and legacy jobs.
          $ref: "#/components/schemas/Bundle"
        items:
          type: array
          description: Present only for succeeded jobs.
          items:
            $ref: "#/components/schemas/Item"
      additionalProperties: false
    Item:
      type: object
      required:
        - id
        - file_name
        - media_type
        - size_bytes
        - download_url
        - download_expires_at
      properties:
        id:
          type: string
        file_name:
          type: string
          description: Server-generated download file name.
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        download_url:
          type: string
          format: uri
          description: Absolute link built from OMDI_PUBLIC_URL; replaced on every poll.
        download_expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Bundle:
      type: object
      required:
        - file_name
        - media_type
        - size_bytes
        - download_url
        - download_expires_at
      properties:
        file_name:
          type: string
          description: Server-generated ZIP download name.
        media_type:
          type: string
          const: application/zip
        size_bytes:
          type: integer
          minimum: 1
        download_url:
          type: string
          format: uri
          description: Opaque-token URL at /v1/bundles/{token}, built from OMDI_PUBLIC_URL and replaced on every poll. May be reused for HEAD and Range until replacement or expiry.
        download_expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Readiness:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
      additionalProperties: false
